name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"

      - name: Vet transport core
        working-directory: core
        run: go vet ./...

      - name: Test transport core
        working-directory: core
        run: go test -race ./...

      - name: Scan transport core for known vulnerabilities
        working-directory: core
        env:
          GOVULNCHECK_VERSION: v1.8.0
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Lightweight lint
        run: |
          set -euo pipefail
          test -x client/gradlew
          test -f client/app/build.gradle.kts
          private_root='/root/Traffic''Wrapper'
          # `! cmd` does not trip `set -e`, so each negative check fails explicitly.
          if grep -R "$private_root" -n README.md README.ru.md core client build; then exit 1; fi
          if git ls-files | grep -E '(^|/)(.*\.jks|.*\.keystore|.*\.apk|update\.key|.*\.minisign\.key)$'; then exit 1; fi
          # Version defaults belong to client/app/build.gradle.kts only.
          if grep -nE 'TW_VERSION_(CODE|NAME):-[^}]' build/*.sh; then exit 1; fi
          grep -q '^distributionSha256Sum=[0-9a-f]\{64\}$' client/gradle/wrapper/gradle-wrapper.properties
          test -f client/gradle/verification-metadata.xml

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "26.3.11579264"
      GOMOBILE_VERSION: a1d90793fc63015513ae877a689ddcc0903750ae
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: core/go.sum

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build transport AAR
        working-directory: core
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          mkdir -p ../client/app/libs
          gomobile init
          gomobile bind \
            -target=android/arm64 \
            -androidapi=26 \
            -javapkg=pro.trafficwrapper.go \
            -o ../client/app/libs/transport.aar \
            ./transport

      - name: Unit tests and build
        working-directory: client
        run: ./gradlew --no-daemon testPublicDebugUnitTest assemblePublicDebug assemblePublicRelease
